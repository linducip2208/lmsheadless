name = "lms-headless-api"
main = "src/index.ts"
compatibility_date = "2024-09-25"

[vars]
DEFAULT_LANG = "en"
# Production: set exact origins, e.g. ALLOWED_ORIGINS = "https://admin.example.com,https://app.example.com"
ALLOWED_ORIGINS = ""
COOKIE_SECURE = "1"

# Local D1 (create with: wrangler d1 create lms-headless)
[[d1_databases]]
binding = "DB"
database_name = "lms-headless"
database_id = "c7e909d7-7c6e-45c0-8a5c-818802253925"
migrations_dir = "../../migrations"

# Production file storage
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "lms-storage"

# Cache / rate-limit backing store
[[kv_namespaces]]
binding = "KV"
id = "0feb57497ded4d4bb501e27dd740a34a"

[dev]
port = 8787

# Native maintenance scheduler (Worker `scheduled` handler in src/index.ts):
# - `0 17 * * *`  daily 00:00 Asia/Jakarta → AI retention purge + publishes
#   courses whose publish_at has arrived (audit: sys.cron.*)
# - `0 17 1 * *`  1st of month 00:00 Asia/Jakarta → additionally resets AI
#   monthly quota used_count
# Kill switch: set CRON_DISABLED = "1" in [vars] to skip logic without
# removing the triggers. HTTP endpoints (/ai/retention/purge,
# /ai/usage/reset, /courses/publish-due) stay available for manual runs.
[triggers]
crons = ["0 17 * * *", "0 17 1 * *"]

